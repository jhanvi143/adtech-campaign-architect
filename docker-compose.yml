services:
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama

  app:
    build: .
    environment:
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: qwen3.5:0.8b
      OLLAMA_FALLBACK_MODEL: qwen3.5:0.8b
      OLLAMA_KEEP_ALIVE: 30m
    ports:
      - "8000:8000"
    depends_on:
      - ollama

volumes:
  ollama:
